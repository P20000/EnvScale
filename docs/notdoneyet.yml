# EnvScale Feature Completion Matrix & Visual Gap Roadmap
# File: docs/notdoneyet.yml

version: "1.0"
project: "EnvScale"
description: "Structured tracking matrix of completed capabilities vs. pending features across Kubernetes abstractions, visual observability, and infrastructure engines."

categories:
  - id: "storage"
    name: "Storage & Persistent Volumes"
    items:
      - name: "PersistentVolumeClaims (PVCs)"
        status: "completed"
        details: "Dedicated React Flow canvas nodes (K8sPVCNode) displaying capacity, phase (Bound, Pending, Lost), access modes (RWO, RWX), and StorageClass badges. Real-time pod mount edges (Pod -> PVC) with container mount paths."
      - name: "PersistentVolumes (PVs)"
        status: "completed"
        details: "Physical cluster-scoped volume details consolidated in the Inspector Drawer (StorageOverviewSection), displaying bound PV names, reclaim policies (Delete, Retain, Recycle), and driver sources (HostPath, CSI, NFS, Local)."
      - name: "StorageClasses"
        status: "completed"
        details: "Provisioner driver identification and StorageClass metadata surfaced per volume claim card and inspector overview."
      - name: "Volume Snapshots"
        status: "pending"
        details: "No representation of VolumeSnapshot or VolumeSnapshotContent resources."

  - id: "configuration_secrets"
    name: "Configuration, Secrets & Vault"
    items:
      - name: "ConfigMaps & Secrets"
        status: "completed"
        details: "Sanitized Informers in k8s-streamer, sub-200ms WebSocket streaming (EVENT_CONFIGMAP_*, EVENT_SECRET_*), workload card key references, and dedicated inspector drawer overview (ConfigOverviewSection)."
      - name: "Kubeconfig & TLS Secrets Vault"
        status: "completed"
        details: "AES-256-GCM encryption/decryption module for cluster credential storage in api-server and TLS secret badges on Ingress cards."
      - name: "Mutating & Validating Webhooks"
        status: "pending"
        details: "Invisible interceptors that modify or reject API requests before admission."

  - id: "networking_ingress"
    name: "Networking, Traffic Policies & Ingress"
    items:
      - name: "NetworkPolicies (Telemetry & Policy Enforcement)"
        status: "completed"
        details: "Real-time client-go informers, sub-200ms streaming (EVENT_NETWORKPOLICY_*), workload card enforcement badge (POL shield on K8sGroupNode), and dedicated Inspector Drawer section (NetworkPolicyRolloutSection) detailing ingress/egress rules, CIDRs, selectors, and port allowances."
      - name: "NetworkPolicies (Visual Perimeter Overlay)"
        status: "pending"
        details: "No interactive canvas-wide visual firewall perimeter boundaries or highlighted blocked vs. permitted inter-microservice link lines."
      - name: "Ingress Controllers & Dynamic Path Routing"
        status: "completed"
        details: "Ingress header cards, domain host tags, TLS secret badges, and EdgeLabelRenderer path/port badges (/:80, /api:3001)."
      - name: "Endpoints & Service Discovery"
        status: "completed"
        details: "Active matched endpoint calculations (calculateEdgeHealth), ClusterIP routing, and live endpoint count badges."
      - name: "Gateway API"
        status: "pending"
        details: "Missing next-gen networking abstractions (Gateway, HTTPRoute, GRPCRoute, ReferenceGrant)."
      - name: "Endpoints & EndpointSlices"
        status: "pending"
        details: "Only the parent Service is shown; individual EndpointSlice routing distributions are omitted."
      - name: "ExternalName Services"
        status: "pending"
        details: "No visualization of DNS alias pointers routing outside the cluster."

  - id: "scaling_governance"
    name: "Scaling, Resource Governance & Scheduling"
    items:
      - name: "Horizontal Pod Autoscalers (HPA)"
        status: "completed"
        details: "Client-go informers (policy_hpa_informer.go), live WebSocket streaming (EVENT_HPA_*), workload card scaling boundary tags on K8sGroupNode (HPA min–max with live CPU% vs. target tooltip), and dedicated Inspector Drawer section (AutoscalingHPASection)."
      - name: "PodDisruptionBudgets (PDB)"
        status: "completed"
        details: "Client-go informers (pdb_informer.go), live WebSocket streaming (EVENT_PDB_*), workload card disruption markers (PDB allowed with emerald/amber status states), Inspector Drawer section (PodDisruptionBudgetSection), and in-flight disruption tracking chaos safety guardrails (pkg/chaos/safety.go)."
      - name: "ResourceQuotas & LimitRanges"
        status: "completed"
        details: "Client-go CoreV1 informers (quota_informer.go), live WebSocket streaming (EVENT_RESOURCE_QUOTA_*, EVENT_LIMIT_RANGE_*), workload card quota pressure tags on K8sGroupNode (QUOTA {pct}% with active utilization tooltip), namespace quota status dots in NamespaceFilterPill, and dedicated Inspector Drawer section (ResourceQuotaSection) rendering CPU, Memory, and Pod capacity gauges and container limit ranges."
      - name: "Vertical Pod Autoscalers (VPA)"
        status: "pending"
        details: "No automated CPU/memory recommendation or in-place resizing representation."
      - name: "PriorityClasses"
        status: "pending"
        details: "No indicator of pod scheduling preemption priority (e.g., system-critical vs. best-effort)."

  - id: "infrastructure_topology"
    name: "Physical & Virtual Infrastructure Topology"
    items:
      - name: "Worker Node Cards & Placement"
        status: "completed"
        details: "Dedicated K8sWorkerNode cards, assigned Node placement calculator (getNodeAssignment()), pod IP inspector, and dynamic node uptime tracking."
      - name: "Kubernetes Node Boundary Boxes"
        status: "pending"
        details: "Pods show their host node as a string in the drawer, but the canvas lacks visual Node grouping bounding boxes, multi-zone boundaries (e.g., us-east-1a, us-east-1b), or rack layouts."
      - name: "Taints & Tolerations"
        status: "pending"
        details: "No visual markers showing which nodes reject unscheduled workloads."
      - name: "Node Affinity / Anti-Affinity & Topology Spread"
        status: "pending"
        details: "No visual links representing pod co-location or anti-affinity distribution rules across zones."

  - id: "rbac_security"
    name: "Identity, Access & Security (RBAC)"
    items:
      - name: "Workspace RBAC & Access Guards"
        status: "completed"
        details: "REST API JWT authentication middleware and Workspace Access Guards (ADMIN, MEMBER, VIEWER)."
      - name: "Kubernetes ServiceAccounts"
        status: "pending"
        details: "No representation of in-cluster pod execution identity."
      - name: "Kubernetes Roles & ClusterRoles"
        status: "pending"
        details: "No visual mapping of API authorization permissions."
      - name: "Kubernetes RoleBindings & ClusterRoleBindings"
        status: "pending"
        details: "No link lines mapping identities to granted privileges."

  - id: "crds_operators"
    name: "Custom Resource Definitions (CRDs) & Ecosystem Operators"
    items:
      - name: "Canary Deployments & Rollout Tracking"
        status: "completed"
        details: "Canary version label tags, ArgoEdge.tsx, and revision history comparison with rollback support."
      - name: "Argo Rollouts (CRD Controller)"
        status: "pending"
        details: "Canary steps, blue/green analysis runs, and pause steps."
      - name: "Cert-Manager"
        status: "pending"
        details: "Issuer and Certificate lifecycle/expiration statuses."
      - name: "Service Mesh Resources"
        status: "pending"
        details: "Istio/Linkerd VirtualService, DestinationRule, EnvoyFilter, and mTLS encryption indicators."

  - id: "cluster_connectivity_agent"
    name: "Cluster Connectivity & Observability Infrastructure"
    items:
      - name: "Outbound In-Cluster Streaming Agent Runner"
        status: "completed"
        details: "Reverse WebSocket agent gateway (/ws/agent) in k8s-streamer, enabling private/firewalled Kubernetes clusters to stream informers outbound without exposing public kubeconfig endpoints."
      - name: "Agent Manifest Generation API"
        status: "completed"
        details: "REST endpoint (GET /api/v1/clusters/:id/agent-manifest) generating fully configured RBAC and Deployment manifests for one-click deployment."
      - name: "In-Cluster Agent Onboarding Wizard"
        status: "completed"
        details: "Interactive UI wizard in apps/web with 1-click kubectl apply installation command and live connection handshake detection."
      - name: "Dynamic Cluster Health Index"
        status: "completed"
        details: "TopNavbar dynamic health badge with calculated grade (A+ through F) and numerical score (0–100) based on pod health, restarts, and resource pressure."
      - name: "Non-Destructive Hybrid Drag Layout"
        status: "completed"
        details: "Hybrid layout engine persisting user-dragged node coordinates across browser reloads, WS re-syncs, and cluster reconnects."
