version: "3.9"

services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: envscale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: envscale
      POSTGRES_PASSWORD: envscale_password
      POSTGRES_DB: envscale
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envscale -d envscale"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-memory Redis Cache / PubSub
  redis:
    image: redis:7-alpine
    container_name: envscale-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend REST API Server
  api-server:
    image: ${API_SERVER_IMAGE:?API_SERVER_IMAGE must be specified}
    container_name: envscale-api-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be specified}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be specified}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be specified}
      KUBECONFIG_ENCRYPTION_KEY: ${KUBECONFIG_ENCRYPTION_KEY:?KUBECONFIG_ENCRYPTION_KEY must be specified}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://envscale.duckdns.org,http://envscale.duckdns.org,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be specified}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://envscale.duckdns.org}
      K8S_STREAMER_URL: "${K8S_STREAMER_URL:-http://k8s-streamer:8080}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Kubernetes Streaming Gateway
  k8s-streamer:
    image: ${STREAMER_IMAGE:?STREAMER_IMAGE must be specified}
    container_name: envscale-k8s-streamer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      NODE_ENV: "production"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be specified}
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      ALLOW_ANONYMOUS_WS: "true"
      CORS_ORIGIN: "${CORS_ORIGIN:-https://envscale.duckdns.org,http://envscale.duckdns.org,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}"
      ALLOWED_ORIGINS: "${CORS_ORIGIN:-https://envscale.duckdns.org,http://envscale.duckdns.org,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}"
      KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
    volumes:
      # Mount the local node's real K3s kubeconfig
      - /etc/rancher/k3s/k3s.yaml:/etc/rancher/k3s/k3s.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy

  # Frontend Web UI
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be specified}
    container_name: envscale-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      api-server:
        condition: service_healthy
      k8s-streamer:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
