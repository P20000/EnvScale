# ==============================================================================
# EnvScale — Consolidated Production Runtime Stack (Contract v2.0)
# ==============================================================================
# Architectural Separation:
#   1. Stateful Data Tier (postgres, redis):
#      - Backed by persistent named volumes (envscale_postgres_data, envscale_redis_data).
#      - Isolated strictly on internal bridge network 'envscale_internal' (zero host ports).
#      - Never recreated during application-only rollbacks.
#   2. Disposable Application Tier (api-server, k8s-streamer, web):
#      - Deployed exclusively from immutable @sha256:... image digests (--no-build).
#      - Stateless read-only root filesystems with bounded RAM tmpfs scratch mounts.
#      - Bound exclusively to 127.0.0.1 loopback behind host Caddy TLS termination.
#   3. Zero Secret Fallbacks:
#      - Every credential and image reference uses mandatory ':?' interpolation.
# ==============================================================================

name: ${COMPOSE_PROJECT_NAME:-envscale}

services:
  # ----------------------------------------------------------------------------
  # Stateful Data Tier
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: ${COMPOSE_PROJECT_NAME:-envscale}-postgres
    restart: unless-stopped
    labels:
      com.envscale.tier: "stateful-data"
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-envscale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be specified}
      POSTGRES_DB: ${POSTGRES_DB:-envscale}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - envscale_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-envscale}\" -d \"$${POSTGRES_DB:-envscale}\""]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  redis:
    image: redis:7.4.12-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    container_name: ${COMPOSE_PROJECT_NAME:-envscale}-redis
    restart: unless-stopped
    labels:
      com.envscale.tier: "stateful-data"
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be specified}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks:
      - envscale_internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -Fxq PONG"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Disposable Application Tier (Digest-Pinned & Read-Only RootFS)
  # ----------------------------------------------------------------------------
  api-server:
    image: ${API_SERVER_IMAGE:?API_SERVER_IMAGE must be an explicit @sha256 digest reference}
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    container_name: ${COMPOSE_PROJECT_NAME:-envscale}-api-server
    restart: unless-stopped
    labels:
      com.envscale.tier: "disposable-app"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be specified}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be specified}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be specified}
      KUBECONFIG_ENCRYPTION_KEY: ${KUBECONFIG_ENCRYPTION_KEY:?KUBECONFIG_ENCRYPTION_KEY must be specified}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be specified}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be specified}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be specified}
      K8S_STREAMER_URL: "http://k8s-streamer:8080"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
    networks:
      - envscale_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  k8s-streamer:
    image: ${STREAMER_IMAGE:?STREAMER_IMAGE must be an explicit @sha256 digest reference}
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    container_name: ${COMPOSE_PROJECT_NAME:-envscale}-k8s-streamer
    user: "${STREAMER_UID_GID:-10001:10001}"
    restart: unless-stopped
    labels:
      com.envscale.tier: "disposable-app"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${STREAMER_HOST_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      NODE_ENV: "production"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be specified}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be specified}
      ALLOW_ANONYMOUS_WS: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be specified}
      ALLOWED_ORIGINS: ${CORS_ORIGIN:?CORS_ORIGIN must be specified}
      KUBECONFIG: "/etc/envscale/kubeconfig.yaml"
    volumes:
      - ${K3S_KUBECONFIG_HOST_PATH:?K3S_KUBECONFIG_HOST_PATH must be specified}:/etc/envscale/kubeconfig.yaml:ro
    networks:
      - envscale_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be an explicit @sha256 digest reference}
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    container_name: ${COMPOSE_PROJECT_NAME:-envscale}-web
    restart: unless-stopped
    labels:
      com.envscale.tier: "disposable-app"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /run:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:80"
    networks:
      - envscale_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      api-server:
        condition: service_healthy
      k8s-streamer:
        condition: service_healthy

networks:
  envscale_internal:
    driver: bridge

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-envscale_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-envscale_redis_data}
