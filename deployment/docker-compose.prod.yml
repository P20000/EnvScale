version: "3.9"

services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: envscale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: envscale
      POSTGRES_PASSWORD: envscale_password
      POSTGRES_DB: envscale
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envscale -d envscale"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-memory Redis Cache / PubSub
  redis:
    image: redis:7-alpine
    container_name: envscale-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend REST API Server
  api-server:
    build:
      context: ..
      dockerfile: apps/api-server/Dockerfile
    container_name: envscale-api-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      DATABASE_URL: "${DATABASE_URL:-postgresql://envscale:envscale_password@postgres:5432/envscale}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-demo-college-jwt-access-secret-32-chars-long}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-demo-college-jwt-refresh-secret-32-chars-long}"
      KUBECONFIG_ENCRYPTION_KEY: "${KUBECONFIG_ENCRYPTION_KEY:-dGhpcy1pcy1hLTMyLWJ5dGUtYmFzZTY0LWtleS0xMjM=}"
      CORS_ORIGIN: "${CORS_ORIGIN:-https://envscale.duckdns.org,http://envscale.duckdns.org,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-9f8a3c4b1e2d7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-https://envscale.duckdns.org}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Kubernetes Streaming Gateway
  k8s-streamer:
    build:
      context: ../apps/k8s-streamer
      dockerfile: Dockerfile
    container_name: envscale-k8s-streamer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: "production"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-demo-college-jwt-access-secret-32-chars-long}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      ALLOW_ANONYMOUS_WS: "true"
      CORS_ORIGIN: "${CORS_ORIGIN:-https://envscale.duckdns.org,http://envscale.duckdns.org,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,*},*"
      ALLOWED_ORIGINS: "*"
      KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
    volumes:
      # Mount the local node's real K3s kubeconfig
      - /etc/rancher/k3s/k3s.yaml:/etc/rancher/k3s/k3s.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  # Frontend Web UI
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_STREAMER_BASE_URL: ""
        VITE_WS_URL: "/ws/k8s"
    container_name: envscale-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api-server
      - k8s-streamer

volumes:
  postgres_data:
  redis_data:
