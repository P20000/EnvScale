name: EnvScale CD - Build & Deploy

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'deployment/terraform/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images (GHCR)
    runs-on: ubuntu-latest
    outputs:
      owner_lc: ${{ steps.normalize_owner.outputs.owner_lc }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Repository Owner Name
        id: normalize_owner
        run: |
          OWNER_LOWER="${OWNER,,}"
          echo "OWNER_LC=${OWNER_LOWER}" >> ${GITHUB_ENV}
          echo "owner_lc=${OWNER_LOWER}" >> ${GITHUB_OUTPUT}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Build & Push API Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/envscale-api-server:latest
            ghcr.io/${{ env.OWNER_LC }}/envscale-api-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push K8s Streamer
        uses: docker/build-push-action@v5
        with:
          context: ./apps/k8s-streamer
          file: ./apps/k8s-streamer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/envscale-k8s-streamer:latest
            ghcr.io/${{ env.OWNER_LC }}/envscale-k8s-streamer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web UI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          build-args: |
            VITE_API_BASE_URL=
            VITE_STREAMER_BASE_URL=
            VITE_WS_URL=/ws/k8s
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/envscale-web:latest
            ghcr.io/${{ env.OWNER_LC }}/envscale-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 Integration Host
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      OWNER_LC: ${{ needs.build-and-push.outputs.owner_lc || 'p20000' }}
    steps:
      - name: Check Deployment Credentials
        id: check_creds
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ] && [ -n "$EC2_HOST" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::SSH_PRIVATE_KEY or EC2_HOST secret not configured in GitHub Repository Settings. Deployment step skipped."
          fi

      - name: Deploy via SSH
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          KUBECONFIG_ENCRYPTION_KEY: ${{ secrets.KUBECONFIG_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: "ubuntu"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DATABASE_URL,REDIS_URL,DUCKDNS_DOMAIN,DUCKDNS_TOKEN,BETTER_AUTH_SECRET,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,KUBECONFIG_ENCRYPTION_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET
          script: |
            set -e
            set +x
            cd /opt/envscale
            if [ -d .git ]; then
              git fetch origin "${{ github.sha }}" || git fetch origin develop
              git checkout -f "${{ github.sha }}" || git checkout -f origin/develop
            fi
            chmod +x ./envscale.sh

            # Provision production .env from GitHub 'production' Environment secrets.
            # Written atomically with 0600 perms; values are never echoed to logs.
            (
              umask 077
              {
                printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
                printf 'REDIS_URL=%s\n' "$REDIS_URL"
                printf 'DUCKDNS_DOMAIN=%s\n' "$DUCKDNS_DOMAIN"
                printf 'DUCKDNS_TOKEN=%s\n' "$DUCKDNS_TOKEN"
                printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
                printf 'JWT_ACCESS_SECRET=%s\n' "$JWT_ACCESS_SECRET"
                printf 'JWT_REFRESH_SECRET=%s\n' "$JWT_REFRESH_SECRET"
                printf 'KUBECONFIG_ENCRYPTION_KEY=%s\n' "$KUBECONFIG_ENCRYPTION_KEY"
                printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
                printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
              } > /opt/envscale/.env.provision
              chmod 600 /opt/envscale/.env.provision
              [ -f /opt/envscale/.env ] && cp -f /opt/envscale/.env /opt/envscale/.env.prev && chmod 600 /opt/envscale/.env.prev
              mv -f /opt/envscale/.env.provision /opt/envscale/.env
            )
            echo "[INFO] Production .env provisioned (0600)."

            # envscale.sh loads .env, validates required secrets (fails if missing), then deploys.
            RELEASE_SHA="${{ github.sha }}" \
            API_SERVER_IMAGE="ghcr.io/${{ env.OWNER_LC }}/envscale-api-server:${{ github.sha }}" \
            STREAMER_IMAGE="ghcr.io/${{ env.OWNER_LC }}/envscale-k8s-streamer:${{ github.sha }}" \
            WEB_IMAGE="ghcr.io/${{ env.OWNER_LC }}/envscale-web:${{ github.sha }}" \
            OWNER_LC="${{ env.OWNER_LC }}" \
            ./envscale.sh deploy
