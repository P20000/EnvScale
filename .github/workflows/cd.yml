name: EnvScale CD - Build & Deploy

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'deployment/terraform/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-server
            image: envscale-api-server
            context: .
            file: ./apps/api-server/Dockerfile
            build_args: ""
          - name: k8s-streamer
            image: envscale-k8s-streamer
            context: ./apps/k8s-streamer
            file: ./apps/k8s-streamer/Dockerfile
            build_args: ""
          - name: web
            image: envscale-web
            context: .
            file: ./apps/web/Dockerfile
            build_args: |
              VITE_API_BASE_URL=
              VITE_STREAMER_BASE_URL=
              VITE_WS_URL=/ws/k8s
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Repository Owner Name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Build & Push Immutable Commit Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          build-args: ${{ matrix.service.build_args }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record Immutable Image Digest
        run: |
          printf '%s\n' "${{ steps.build.outputs.digest }}" > "digest-${{ matrix.service.name }}.txt"

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service.name }}
          path: digest-${{ matrix.service.name }}.txt
          retention-days: 7

  generate-manifest:
    name: Generate & Validate Release Manifest
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Exact Commit
        uses: actions/checkout@v4

      - name: Download Image Digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true

      - name: Normalize Repository Owner Name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Generate Schema-Validated Release Manifest
        run: |
          API_DIGEST="$(tr -d '[:space:]' < digest-api-server.txt)"
          STREAMER_DIGEST="$(tr -d '[:space:]' < digest-k8s-streamer.txt)"
          WEB_DIGEST="$(tr -d '[:space:]' < digest-web.txt)"
          python3 deployment/scripts/generate-release-manifest.py \
            --repository "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --commit-sha "${{ github.sha }}" \
            --owner-lc "${{ env.OWNER_LC }}" \
            --api-digest "${API_DIGEST}" \
            --streamer-digest "${STREAMER_DIGEST}" \
            --web-digest "${WEB_DIGEST}" \
            --workflow-name "${{ github.workflow }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --builder-identity "${{ github.workflow_ref }}" \
            --output release-manifest.json
          python3 deployment/scripts/validate-release-manifest.py \
            --manifest release-manifest.json \
            --verify-repo-migrations

      - name: Upload Release Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 30

      - name: Check S3 Release Publishing Config
        id: s3_cfg
        env:
          AWS_RELEASE_ROLE_ARN: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          RECOVERY_BUCKET: ${{ vars.RECOVERY_BUCKET }}
        run: |
          if [ -n "$AWS_RELEASE_ROLE_ARN" ] && [ -n "$RECOVERY_BUCKET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS Release OIDC Credentials
        if: steps.s3_cfg.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Publish Immutable Release Manifest to S3
        if: steps.s3_cfg.outputs.enabled == 'true'
        run: |
          aws s3 cp release-manifest.json "s3://${{ vars.RECOVERY_BUCKET }}/releases/${{ github.sha }}/release-manifest.json"

  deploy:
    name: Deploy to EC2 Host via AWS SSM
    needs: generate-manifest
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check SSM Deployment Credentials
        id: check_creds
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
        run: |
          if [ -n "$AWS_DEPLOY_ROLE_ARN" ] && [ -n "$EC2_INSTANCE_ID" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::AWS_DEPLOY_ROLE_ARN or EC2_INSTANCE_ID not configured. SSM deployment step skipped."
          fi

      - name: Configure AWS Deploy Credentials
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Download Validated Release Manifest
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Dispatch Exact-SHA Host Runtime via SSM
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          TARGET_SHA: ${{ github.sha }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: |
          set -euo pipefail
          MANIFEST_B64="$(base64 -w0 release-manifest.json)"
          COMMAND_ID="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "EnvScale deploy ${TARGET_SHA}" \
            --parameters "$(python3 - "${TARGET_SHA}" "${MANIFEST_B64}" <<'PYEOF'
          import json, sys
          sha, manifest_b64 = sys.argv[1], sys.argv[2]
          cmds = [
              "set -euo pipefail",
              "test -d /opt/envscale/.git || { echo '[FATAL] EC2 repository checkout is missing.'; exit 1; }",
              "cd /opt/envscale",
              f"git fetch --no-tags origin {sha}",
              f"git checkout --detach {sha}",
              f"test \"$(git rev-parse HEAD)\" = {sha}",
              "chmod +x ./envscale.sh deployment/scripts/*.sh deployment/scripts/*.py",
              "mkdir -p /etc/envscale /var/lib/envscale",
              "chmod 700 /etc/envscale /var/lib/envscale",
              "python3 /opt/envscale/deployment/scripts/sync-ssm-secrets.py --ssm-prefix /envscale/prod --output /etc/envscale/secrets.env",
              f"echo '{manifest_b64}' | base64 -d > /var/lib/envscale/pending-release-manifest.json",
              "chmod 600 /var/lib/envscale/pending-release-manifest.json",
              "ENVSCALE_SECRETS_FILE=/etc/envscale/secrets.env /opt/envscale/envscale.sh deploy --manifest /var/lib/envscale/pending-release-manifest.json",
          ]
          print(json.dumps({"commands": cmds}))
          PYEOF
          )" \
            --query "Command.CommandId" \
            --output text)"

          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" || true

          STATUS="$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "Status" \
            --output text)"
          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text
          if [ "${STATUS}" != "Success" ]; then
            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "StandardErrorContent" \
              --output text >&2
            exit 1
          fi
