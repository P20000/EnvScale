name: EnvScale CD - Build & Deploy

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'deployment/terraform/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      force_deploy_gate:
        description: "Force production deploy approval gate even if repo-level EC2_INSTANCE_ID is unset"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-server
            image: envscale-api-server
            context: .
            file: ./apps/api-server/Dockerfile
            build_args: ""
          - name: k8s-streamer
            image: envscale-k8s-streamer
            context: ./apps/k8s-streamer
            file: ./apps/k8s-streamer/Dockerfile
            build_args: ""
          - name: web
            image: envscale-web
            context: .
            file: ./apps/web/Dockerfile
            build_args: |
              VITE_API_BASE_URL=
              VITE_STREAMER_BASE_URL=
              VITE_WS_URL=/ws/k8s
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Repository Owner Name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Build & Push Immutable Commit Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          build-args: ${{ matrix.service.build_args }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record Immutable Image Digest
        run: |
          printf '%s\n' "${{ steps.build.outputs.digest }}" > "digest-${{ matrix.service.name }}.txt"

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service.name }}
          path: digest-${{ matrix.service.name }}.txt
          retention-days: 7

  generate-manifest:
    name: Generate & Validate Release Manifest
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Exact Commit
        uses: actions/checkout@v4

      - name: Download Image Digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true

      - name: Normalize Repository Owner Name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Generate Schema-Validated Release Manifest
        run: |
          API_DIGEST="$(tr -d '[:space:]' < digest-api-server.txt)"
          STREAMER_DIGEST="$(tr -d '[:space:]' < digest-k8s-streamer.txt)"
          WEB_DIGEST="$(tr -d '[:space:]' < digest-web.txt)"
          python3 deployment/scripts/generate-release-manifest.py \
            --repository "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --commit-sha "${{ github.sha }}" \
            --owner-lc "${{ env.OWNER_LC }}" \
            --api-digest "${API_DIGEST}" \
            --streamer-digest "${STREAMER_DIGEST}" \
            --web-digest "${WEB_DIGEST}" \
            --workflow-name "${{ github.workflow }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --builder-identity "${{ github.workflow_ref }}" \
            --output release-manifest.json
          python3 deployment/scripts/validate-release-manifest.py \
            --manifest release-manifest.json \
            --verify-repo-migrations

      - name: Upload Release Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 30

      - name: Check S3 Release Publishing Config
        id: s3_cfg
        env:
          AWS_RELEASE_ROLE_ARN: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          RECOVERY_BUCKET: ${{ vars.RECOVERY_BUCKET }}
        run: |
          if [ -n "$AWS_RELEASE_ROLE_ARN" ] && [ -n "$RECOVERY_BUCKET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS Release OIDC Credentials
        if: steps.s3_cfg.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Publish Immutable Release Manifest to S3
        if: steps.s3_cfg.outputs.enabled == 'true'
        run: |
          aws s3 cp release-manifest.json "s3://${{ vars.RECOVERY_BUCKET }}/releases/${{ github.sha }}/release-manifest.json"

  check-deploy-target:
    name: Check Target EC2 Availability
    needs: generate-manifest
    runs-on: ubuntu-latest
    outputs:
      ec2_configured: ${{ steps.check_target.outputs.ec2_configured }}
      reason: ${{ steps.check_target.outputs.reason }}
    steps:
      - name: Check Configured EC2 Deployment Target
        id: check_target
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          FORCE_DEPLOY_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_deploy_gate || false }}
        run: |
          if [ "${FORCE_DEPLOY_GATE}" = "true" ]; then
            echo "ec2_configured=true" >> "$GITHUB_OUTPUT"
            echo "reason=Manual workflow_dispatch requested production deploy gate" >> "$GITHUB_OUTPUT"
            echo "Manual override enabled: proceeding to production approval gate."
          elif [ -n "${EC2_INSTANCE_ID}" ]; then
            echo "ec2_configured=true" >> "$GITHUB_OUTPUT"
            echo "reason=EC2_INSTANCE_ID target is configured" >> "$GITHUB_OUTPUT"
            echo "Configured EC2 deployment target detected; proceeding to production approval gate."
          else
            echo "ec2_configured=false" >> "$GITHUB_OUTPUT"
            echo "reason=No EC2_INSTANCE_ID configured (no active EC2 host provisioned)" >> "$GITHUB_OUTPUT"
            echo "::notice ::No EC2_INSTANCE_ID configured. Skipping production SSM deploy gate and recording verified release artifacts."
          fi

  deploy:
    name: Deploy to EC2 Host via AWS SSM
    needs: [generate-manifest, check-deploy-target]
    if: needs.check-deploy-target.outputs.ec2_configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check SSM Deployment Credentials
        id: check_creds
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
        run: |
          if [ -n "$AWS_DEPLOY_ROLE_ARN" ] && [ -n "$EC2_INSTANCE_ID" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::AWS_DEPLOY_ROLE_ARN or EC2_INSTANCE_ID not configured. SSM deployment step skipped."
          fi

      - name: Configure AWS Deploy Credentials
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Verify Target EC2 Host Is Running
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: |
          set -euo pipefail
          STATE="$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text 2>/dev/null || echo "missing")"
          if [ "${STATE}" != "running" ]; then
            echo "::error ::Target EC2 instance is not running (state=${STATE}). Provision or start the EC2 host, or clear stale EC2_INSTANCE_ID via infra destroy."
            exit 1
          fi
          echo "Verified target EC2 host is in 'running' state."

      - name: Download Validated Release Manifest
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Dispatch Exact-SHA Host Runtime via SSM
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          TARGET_SHA: ${{ github.sha }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: |
          set -euo pipefail
          MANIFEST_B64="$(base64 -w0 release-manifest.json)"
          COMMAND_ID="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "EnvScale deploy ${TARGET_SHA}" \
            --parameters "$(python3 - "${TARGET_SHA}" "${MANIFEST_B64}" "${AWS_REGION}" <<'PYEOF'
          import json, shlex, sys
          sha, manifest_b64, aws_region = sys.argv[1], sys.argv[2], sys.argv[3]
          cmds = [
              "set -euo pipefail",
              "test -d /opt/envscale/.git || { echo '[FATAL] EC2 repository checkout is missing.'; exit 1; }",
              "git config --system --get-all safe.directory 2>/dev/null | grep -Fxq /opt/envscale || git config --system --add safe.directory /opt/envscale",
              "cd /opt/envscale",
              f"git fetch --no-tags origin {sha}",
              f"git checkout --detach {sha}",
              f"test \"$(git rev-parse HEAD)\" = {sha}",
              "chmod +x ./envscale.sh deployment/scripts/*.sh deployment/scripts/*.py",
              "mkdir -p /etc/envscale /var/lib/envscale",
              "chmod 700 /etc/envscale /var/lib/envscale",
              f"python3 /opt/envscale/deployment/scripts/sync-ssm-secrets.py --ssm-prefix /envscale/prod --region {shlex.quote(aws_region)} --output /etc/envscale/secrets.env",
              f"echo '{manifest_b64}' | base64 -d > /var/lib/envscale/pending-release-manifest.json",
              "chmod 600 /var/lib/envscale/pending-release-manifest.json",
              "ENVSCALE_SECRETS_FILE=/etc/envscale/secrets.env /opt/envscale/envscale.sh deploy --manifest /var/lib/envscale/pending-release-manifest.json",
          ]
          print(json.dumps({"commands": [f"/bin/bash -c {shlex.quote(chr(10).join(cmds))}"]}))
          PYEOF
          )" \
            --query "Command.CommandId" \
            --output text)"

          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" || true

          STATUS="$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "Status" \
            --output text)"
          RESP_CODE="$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "ResponseCode" \
            --output text 2>/dev/null || echo "unknown")"
          SSM_OUT="$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text 2>/dev/null || true)"
          printf '%s\n' "${SSM_OUT}"

          {
            echo "### CD Live SSM Rollout Summary"
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| **Commit SHA** | \`${TARGET_SHA}\` |"
            echo "| **Instance ID** | \`${INSTANCE_ID}\` |"
            echo "| **SSM Command ID** | \`${COMMAND_ID}\` |"
            echo "| **SSM Status / Code** | \`${STATUS}\` (\`${RESP_CODE}\`) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${STATUS}" != "Success" ] || [ "${RESP_CODE}" != "0" ]; then
            SSM_ERR="$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "StandardErrorContent" \
              --output text 2>/dev/null || true)"
            REDACTED_ERR="$(python3 - "${SSM_ERR}" <<'PYEOF'
import re, sys
txt = sys.argv[1] or ""
pats = (
    (re.compile(r"(AKIA|ASIA)[A-Z0-9]{16}"), "[REDACTED_AWS_KEY]"),
    (re.compile(r"(ghp|gho|ghs|github_pat)_[A-Za-z0-9_]+"), "[REDACTED_GH_TOKEN]"),
    (re.compile(r"Bearer\s+[A-Za-z0-9._-]+", re.I), "Bearer [REDACTED]"),
    (re.compile(r"(postgres(?:ql)?|redis)://[^/\s@]+@", re.I), r"\1://[REDACTED]@"),
    (re.compile(r"(?i)(token|password|secret)\s*[:=]\s*[^\s'\"]+"), r"\1=[REDACTED]"),
)
for rx, repl in pats:
    txt = rx.sub(repl, txt)
print(txt)
PYEOF
)"
            printf '%s\n' "${REDACTED_ERR}" >&2
            {
              echo ""
              echo "#### Failure Diagnostics (tail, redacted)"
              echo '```text'
              printf '%s\n' "${REDACTED_ERR}" | tail -n 60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify External HTTPS Application Endpoints
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
          DUCKDNS_DOMAIN: ${{ vars.DUCKDNS_DOMAIN }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: |
          set -euo pipefail
          TARGET_URL="${APP_URL}"
          if [ -z "${TARGET_URL}" ] && [ -n "${DUCKDNS_DOMAIN}" ]; then
            if [[ "${DUCKDNS_DOMAIN}" == *.duckdns.org ]]; then
              TARGET_URL="https://${DUCKDNS_DOMAIN}"
            else
              TARGET_URL="https://${DUCKDNS_DOMAIN}.duckdns.org"
            fi
          elif [ -z "${TARGET_URL}" ]; then
            PUBLIC_IP="$(aws ec2 describe-instances \
              --region "${AWS_REGION}" \
              --instance-ids "${INSTANCE_ID}" \
              --query "Reservations[0].Instances[0].PublicIpAddress" \
              --output text 2>/dev/null || true)"
            if [ -n "${PUBLIC_IP}" ] && [ "${PUBLIC_IP}" != "None" ]; then
              TARGET_URL="https://${PUBLIC_IP}.sslip.io"
            fi
          fi

          if [ -z "${TARGET_URL}" ] || [[ "${TARGET_URL}" != https://* ]]; then
            echo "::notice ::Skipping external HTTPS probe because no valid https:// target URL is available."
            exit 0
          fi

          TARGET_URL="${TARGET_URL%/}"
          EXT_OK="false"
          for attempt in 1 2 3; do
            WEB_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${TARGET_URL}/" || echo "000")"
            API_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${TARGET_URL}/api/health" || echo "000")"
            STR_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${TARGET_URL}/healthz" || echo "000")"
            GUARD_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${TARGET_URL}/api/v1/workspaces" || echo "000")"
            if [ "${WEB_CODE}" = "200" ] && [ "${API_CODE}" = "200" ] && [ "${STR_CODE}" = "200" ] && [ "${GUARD_CODE}" = "401" ]; then
              EXT_OK="true"
              break
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep 10
            fi
          done

          {
            echo ""
            echo "#### External HTTPS Verification (\`${TARGET_URL}\`)"
            echo "- \`/\`: \`${WEB_CODE}\` | \`/api/health\`: \`${API_CODE}\` | \`/healthz\`: \`${STR_CODE}\` | \`/api/v1/workspaces\` guard: \`${GUARD_CODE}\` | Result: \`${EXT_OK}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${EXT_OK}" != "true" ]; then
            echo "::error ::External HTTPS health check failed for ${TARGET_URL} (web=${WEB_CODE}, api=${API_CODE}, streamer=${STR_CODE}, guard=${GUARD_CODE})"
            exit 1
          fi

  deploy-fallback-summary:
    name: Verify Release Artifact (No Live EC2 Host)
    needs: [generate-manifest, check-deploy-target]
    if: needs.check-deploy-target.outputs.ec2_configured != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Validated Release Manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Record Viable Release Artifact Summary
        env:
          SKIP_REASON: ${{ needs.check-deploy-target.outputs.reason }}
        run: |
          set -euo pipefail
          RELEASE_ID="$(python3 -c 'import json; print(json.load(open("release-manifest.json")).get("release_id", "unknown"))')"
          {
            echo "### CD Artifact & Release Manifest Verified (No Live EC2 Host)"
            echo ""
            echo "- **Release ID:** \`${RELEASE_ID}\`"
            echo "- **Commit SHA:** \`${GITHUB_SHA}\`"
            echo "- **Container Images:** Built and pushed to GHCR (\`api-server\`, \`k8s-streamer\`, \`web\`) with immutable \`@sha256\` digests."
            echo "- **Release Manifest:** Schema-validated and archived as the \`release-manifest\` workflow artifact."
            echo "- **Live SSM Rollout:** Skipped cleanly (${SKIP_REASON}). Provision an EC2 host via \`pnpm test-center --cli infra up\` (which syncs \`EC2_INSTANCE_ID\`) to re-enable the \`production\` SSM rollout gate."
          } >> "$GITHUB_STEP_SUMMARY"
