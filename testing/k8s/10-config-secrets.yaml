apiVersion: v1
kind: ConfigMap
metadata:
  name: app-runtime-config
  namespace: testing-todo
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/part-of: todo-suite
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  MAX_WORKERS: "16"
  CACHE_TTL_SECONDS: "300"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-db-credentials
  namespace: testing-todo
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/part-of: todo-suite
type: Opaque
stringData:
  DB_USER: "postgres_admin"
  DB_PASSWORD: "SuperSecureClusterSecretPassword123!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processing-service
  namespace: testing-todo
  labels:
    app: order-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-processing
  template:
    metadata:
      labels:
        app: order-processing
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Order processing service started'; sleep 3600"]
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
            - name: secrets-volume
              mountPath: /etc/secrets
              readOnly: true
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-credentials
                  key: DB_PASSWORD
          envFrom:
            - configMapRef:
                name: app-runtime-config
      volumes:
        - name: config-volume
          configMap:
            name: app-runtime-config
        - name: secrets-volume
          secret:
            secretName: app-db-credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faulty-config-consumer
  namespace: testing-todo
  labels:
    app: faulty-config-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faulty-config-consumer
  template:
    metadata:
      labels:
        app: faulty-config-consumer
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: MISSING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: non-existent-api-secret
                  key: API_KEY
