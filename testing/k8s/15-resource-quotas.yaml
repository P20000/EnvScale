apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: default
  labels:
    app.kubernetes.io/managed-by: envscale
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-limits
  namespace: default
  labels:
    app.kubernetes.io/managed-by: envscale
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 1Gi
      min:
        cpu: 50m
        memory: 64Mi
